[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-guard"
version = "0.1.1"
description = "Read-only, range-limited Ethereum wallet authorization inventory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31"]

[project.scripts]
eth-guard = "eth_guard.cli:main"

[tool.setuptools.packages.find]
include = ["eth_guard*"]

[tool.setuptools.package-data]
eth_guard = ["fixtures/*.json"]
